version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "@zemd/*"
    versioning-strategy: "increase"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "npm"
    directories:
      - "/eslint/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "@zemd/*"
    versioning-strategy: "increase"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      eslint-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directories:
      - "/vscode/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "@zemd/*"
    versioning-strategy: "increase"
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      vscode-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      devcontainer-images:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      devcontainer-features:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
