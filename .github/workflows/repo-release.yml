# Keep this file named `repo-release.yml`: npm trusted publishing validates the
# calling workflow filename, not the reusable workflow that submits packages.
name: Release

permissions: {}

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # https://consoledonottrack.com - opts out of Turborepo and other CLI telemetry
  DO_NOT_TRACK: 1

jobs:
  release:
    name: Release
    uses: zemd/js/.github/workflows/shared-release.yml@90cbb33b807a57692d0b86fb24e41c003e440c8e # v4.0.4
    permissions:
      contents: read # check release state and pinned tooling
      id-token: write # npm trusted publishing (OIDC)
    with:
      release-branchkeeper-client-id: ${{ vars.RELEASE_BRANCHKEEPER_CLIENT_ID }}
      release-publisher-client-id: ${{ vars.RELEASE_PUBLISHER_CLIENT_ID }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      RELEASE_BRANCHKEEPER_PRIVATE_KEY: ${{ secrets.RELEASE_BRANCHKEEPER_PRIVATE_KEY }}
      RELEASE_PUBLISHER_PRIVATE_KEY: ${{ secrets.RELEASE_PUBLISHER_PRIVATE_KEY }}

  deploy-eslint-site:
    name: Deploy ESLint site
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static inspector site
        run: pnpm run build --filter=@zemd/eslint-site

      - name: Deploy to Cloudflare Workers
        run: pnpm --dir eslint/site deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
