name: CI

permissions: {}

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: zemd/js/.github/workflows/shared-ci.yml@51102461747d67662560c4176ed201d473ab1bf1 # v4.0.6
    permissions:
      contents: read
    with:
      report-change-intents: true
      dependency-review-severity: high
