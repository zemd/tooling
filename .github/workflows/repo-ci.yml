name: CI

permissions: {}

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: zemd/js/.github/workflows/shared-ci.yml@9256be47f23f4c404b36ec1454d568bbc886fe2a # v4.0.7
    permissions:
      contents: read
    with:
      report-change-intents: true
      dependency-review-severity: high
