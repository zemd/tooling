name: CI

permissions: {}

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: zemd/js/.github/workflows/shared-ci.yml@802d24c5b50e0863a43133d634e78cdc4a7eb99c # v4.0.5
    permissions:
      contents: read
    with:
      report-change-intents: true
      dependency-review-severity: high
