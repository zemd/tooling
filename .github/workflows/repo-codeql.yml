name: CodeQL

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "24 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    uses: zemd/js/.github/workflows/shared-codeql.yml@90cbb33b807a57692d0b86fb24e41c003e440c8e # v4.0.4
    permissions:
      contents: read # checkout the repository for analysis
      actions: read # let CodeQL read workflow-run metadata
      security-events: write # upload results to code scanning
