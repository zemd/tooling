name: CodeQL

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "24 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    uses: zemd/js/.github/workflows/shared-codeql.yml@51102461747d67662560c4176ed201d473ab1bf1 # v4.0.6
    permissions:
      contents: read # checkout the repository for analysis
      actions: read # let CodeQL read workflow-run metadata
      security-events: write # upload results to code scanning
