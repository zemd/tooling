saveExact: true
storeDir: .pnpm-store

packages:
  - eslint/*
  - vscode/*

versioning:
  changelog:
    storage: repository

catalog:
  "@types/eslint": 9.6.1
  "@types/node": 26.2.0
  "@zemd/tsconfig": 2.1.1
  eslint: 10.8.1
  eslint-plugin-react-refresh: 0.5.4
  tsdown: 0.22.14
  zod: 4.4.3

catalogs:
  eslint:
    typescript: 6.0.3
  vscode:
    typescript: 7.0.2

# Bulk pnpm updates must not cross the TypeScript major-version boundary.
update:
  ignoreDeps:
    - typescript

# Seven days; keep aligned with Dependabot's npm cooldown.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - "@zemd/*"
  # Imported direct dependency; keep the exception pinned to this exact release.
  - eslint-plugin-react-refresh@0.5.4
trustPolicy: no-downgrade
trustPolicyExclude:
  # Required transitively by the official VS Code CLI and React compiler plugin.
  - semver@5.7.2 || 6.3.1
allowBuilds:
  "@vscode/vsce-sign": true
  esbuild: true
  keytar: true
  workerd: true
overrides:
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
